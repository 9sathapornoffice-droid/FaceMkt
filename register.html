<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ลงทะเบียนใบหน้า</title>
  <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap" rel="stylesheet">
  <script src="js/api-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Sarabun', sans-serif;
      min-height: 100vh;
      background-color: #0b0c10;
      background-image: 
        radial-gradient(circle at 50% 0%, rgba(230, 0, 18, 0.22) 0%, transparent 60%),
        linear-gradient(180deg, #111218 0%, #08090c 100%);
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px 60px;
      position: relative;
    }

    /* Ambient orb */
    body::before {
      content: '';
      position: fixed;
      width: 400px; height: 400px;
      background: #e60012;
      border-radius: 50%;
      filter: blur(140px);
      opacity: 0.1;
      top: -80px; left: -80px;
      pointer-events: none; z-index: 0;
    }

    .container {
      width: 100%;
      max-width: 500px;
      position: relative; z-index: 1;
      animation: fadeIn 0.5s ease;
    }

    /* Header */
    .page-header {
      text-align: center;
      margin-bottom: 20px;
    }
    .back-btn {
      display: inline-flex; align-items: center; gap: 6px;
      color: #94a3b8; text-decoration: none; font-size: 0.88em;
      padding: 6px 14px; border-radius: 20px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      transition: all 0.25s ease;
      margin-bottom: 14px;
    }
    .back-btn:hover { color: #ffffff; background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.25); }

    .header-logo-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .header-mascot {
      width: 44px;
      height: 44px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
    }

    h2 {
      font-size: 1.5em; font-weight: 700;
      color: #ffffff;
      margin-bottom: 4px;
    }
    .instruction {
      font-size: 0.85em; color: #94a3b8; line-height: 1.6;
    }

    /* Step dots */
    .step-dots {
      display: flex; justify-content: center; gap: 10px;
      margin: 14px 0 18px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: rgba(255,255,255,0.15);
      border: 1.5px solid rgba(255,255,255,0.25);
      transition: all 0.3s ease;
    }
    .dot.active {
      background: #e60012;
      border-color: #ff4d5a;
      box-shadow: 0 0 12px rgba(230,0,18,0.8);
      transform: scale(1.15);
    }

    /* Status */
    #status {
      font-size: 0.88em; color: #cbd5e1;
      margin-bottom: 14px; min-height: 22px;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      text-align: center;
    }
    .spinner {
      display: inline-block;
      width: 14px; height: 14px;
      border: 2px solid rgba(230,0,18,0.3);
      border-top-color: #e60012;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Video */
    .video-wrapper {
      position: relative;
      border-radius: 24px;
      overflow: hidden;
      border: 2px solid rgba(230,0,18,0.45);
      box-shadow: 0 0 30px rgba(230,0,18,0.2), inset 0 0 30px rgba(0,0,0,0.5);
      background: #000000;
      width: 100%;
      max-width: 480px;
      margin: 0 auto;
    }
    video {
      width: 100%; display: block;
      transform: scaleX(-1);
      border-radius: 22px;
    }

    /* Form Section */
    .form-section {
      margin-top: 20px;
      background: rgba(22, 24, 34, 0.75);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 22px 20px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .input-group {
      position: relative;
      margin-bottom: 16px;
    }
    .input-group input {
      width: 100%;
      padding: 14px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      color: #ffffff;
      font-size: 15px;
      font-family: 'Sarabun', sans-serif;
      outline: none;
      transition: all 0.3s ease;
    }
    .input-group input::placeholder { color: #64748b; }
    .input-group input:focus {
      border-color: rgba(230,0,18,0.6);
      background: rgba(230,0,18,0.05);
      box-shadow: 0 0 0 3px rgba(230,0,18,0.2);
    }

    #btnSave {
      width: 100%;
      padding: 15px;
      background: linear-gradient(135deg, #e60012, #a8000d);
      color: white;
      border: none;
      border-radius: 50px;
      font-size: 16px;
      font-weight: 700;
      font-family: 'Sarabun', sans-serif;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 8px;
      transition: all 0.3s ease;
      box-shadow: 0 6px 20px rgba(230,0,18,0.35);
    }
    #btnSave:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(230,0,18,0.55);
    }
    #btnSave:disabled {
      background: rgba(255,255,255,0.08);
      color: #64748b;
      box-shadow: none;
      cursor: default;
    }

    .count-badge {
      background: rgba(255,255,255,0.25);
      padding: 2px 10px;
      border-radius: 20px;
      font-size: 13px;
    }
    #btnSave:not(:disabled) .count-badge {
      background: rgba(255,255,255,0.35);
    }

    #msg {
      margin-top: 14px; min-height: 24px;
      font-size: 0.9em; font-weight: 600;
      text-align: center;
    }
    .msg-success { color: #34d399; }
    .msg-error   { color: #f87171; }

    /* Animations */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    @keyframes spin   { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
<div class="container">
  <div class="page-header">
    <a href="index.html" class="back-btn">← กลับ</a>
    <div class="header-logo-badge">
      <img src="img/mascot.png" alt="ISUZU" class="header-mascot">
    </div>
    <h2>ลงทะเบียนใบหน้าพนักงาน</h2>
    <p class="instruction">ISUZU TSH • บันทึก 3 มุม: หน้าตรง / หันซ้ายเล็กน้อย / หันขวาเล็กน้อย<br>เพื่อความแม่นยำในการจดจำใบหน้าสูงสุด</p>
  </div>

  <div class="step-dots">
    <div class="dot" id="dot1"></div>
    <div class="dot" id="dot2"></div>
    <div class="dot" id="dot3"></div>
  </div>

  <div id="status">
    <span class="spinner"></span> กำลังโหลด AI Model...
  </div>

  <div class="video-wrapper">
    <video id="video" autoplay muted playsinline webkit-playsinline></video>
  </div>

  <div class="form-section">
    <div class="input-group">
      <input type="text" id="username" placeholder="ชื่อ-นามสกุลพนักงาน">
    </div>

    <button id="btnSave" onclick="saveFace()" disabled>
      📸 บันทึกใบหน้า <span id="saveCount" class="count-badge">0</span>
    </button>

    <div id="msg"></div>
  </div>
</div>

<script>
  const API_URL   = localStorage.getItem('gasApiUrl') || (typeof GAS_API_URL !== 'undefined' ? GAS_API_URL : '');
  const video     = document.getElementById('video');
  const statusDiv = document.getElementById('status');
  const btnSave   = document.getElementById('btnSave');
  const msgDiv    = document.getElementById('msg');
  const countSpan = document.getElementById('saveCount');
  let saveCounter = 0;
  let isModelLoaded = false;
  let isCameraActive = false;

  // ตรวจสอบ In-App Browser (LINE, Facebook)
  function isInAppBrowser() {
    const ua = navigator.userAgent || navigator.vendor || window.opera || '';
    return /Line|FBAN|FBAV|Instagram|Twitter/i.test(ua);
  }

  function updateDots() {
    [1,2,3].forEach(i => {
      const dot = document.getElementById('dot' + i);
      if (dot) dot.className = 'dot' + (i <= saveCounter ? ' active' : '');
    });
  }

  function checkReadiness() {
    if (isModelLoaded && isCameraActive) {
      statusDiv.innerHTML = '<span style="color:#34d399">✅ ระบบและกล้องพร้อมใช้งาน</span>';
      btnSave.disabled = false;
    }
  }

  async function getCameraStream() {
    if (!window.isSecureContext && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      throw new Error('SECURE_CONTEXT_REQUIRED');
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      throw new Error('MEDIA_DEVICES_NOT_SUPPORTED');
    }

    const constraintOptions = [
      { video: { facingMode: { ideal: 'user' }, width: { ideal: 1280 }, height: { ideal: 720 } }, audio: false },
      { video: { facingMode: 'user' }, audio: false },
      { video: { facingMode: { ideal: 'user' } }, audio: false },
      { video: true, audio: false }
    ];

    let lastErr = null;
    for (const constraints of constraintOptions) {
      try {
        return await navigator.mediaDevices.getUserMedia(constraints);
      } catch (err) {
        lastErr = err;
      }
    }
    throw lastErr;
  }

  async function startCamera() {
    try {
      video.setAttribute('playsinline', 'true');
      video.setAttribute('webkit-playsinline', 'true');
      video.muted = true;

      const stream = await getCameraStream();
      video.srcObject = stream;
      await video.play().catch(e => console.warn('Video play warning:', e));
      isCameraActive = true;
      checkReadiness();
    } catch (err) {
      isCameraActive = false;
      let errText = '❌ เปิดกล้องไม่ได้: ' + (err.message || err.name);
      if (isInAppBrowser()) {
        errText = '⚠️ กำลังเปิดในแอป (LINE/Facebook) ซึ่งไม่อนุญาตให้เปิดกล้อง กรุณากดปุ่ม <b>...</b> แล้วเลือก <b>"เปิดในเบราว์เซอร์ภายนอก / Safari / Chrome"</b>';
      } else if (err.message === 'SECURE_CONTEXT_REQUIRED') {
        errText = '🔒 มือถือไม่อนุญาตให้เปิดกล้องผ่าน HTTP กรุณาเข้าใช้งานผ่าน <b>HTTPS</b> เท่านั้น';
      } else if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
        errText = '🚫 คุณยังไม่อนุญาตให้ใช้งานกล้อง กรุณาเปิดสิทธิ์กล้องในการตั้งค่าของเบราว์เซอร์ แล้วรีเฟรชหน้า';
      } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
        errText = '📷 ไม่พบอุปกรณ์กล้องบนมือถือของคุณ';
      } else if (err.name === 'NotReadableError' || err.name === 'TrackStartError') {
        errText = '⚠️ กล้องกำลังถูกใช้งานโดยแอปอื่น กรุณาปิดแอปอื่นแล้วลองใหม่';
      }
      statusDiv.innerHTML = '<span style="color:#f87171">' + errText + '</span><br><button onclick="startCamera()" style="margin-top:8px;padding:6px 14px;background:rgba(255,255,255,0.15);border:1px solid rgba(255,255,255,0.3);border-radius:12px;color:#fff;cursor:pointer;">🔄 ลองเปิดกล้องอีกครั้ง</button>';
    }
  }

  async function initModels() {
    try {
      statusDiv.innerHTML = '<span class="spinner"></span> กำลังโหลด AI Model...';
      const MODEL_URL = 'https://justadudewhohacks.github.io/face-api.js/models';
      await Promise.all([
        faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
        faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
        faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
      ]);
      isModelLoaded = true;
      checkReadiness();
    } catch (e) {
      statusDiv.innerHTML = '<span style="color:#f87171">❌ โหลด AI Model ล้มเหลว: ' + e.message + '</span>';
    }
  }

  window.addEventListener('load', () => {
    if (!API_URL) {
      statusDiv.innerHTML = '<span style="color:#f87171">❌ ยังไม่ได้ตั้งค่า API URL — <a href="config.html" style="color:#fbbf24">ไปตั้งค่า</a></span>';
    }
    // เริ่มเปิดกล้องและโหลดโมเดลควบคู่กันเพื่อความรวดเร็วและรองรับมือถือ
    startCamera();
    initModels();
  });

  async function saveFace() {
    const name = document.getElementById('username').value.trim();
    if (!name) return alert('กรุณาใส่ชื่อก่อน');

    btnSave.disabled = true;
    btnSave.innerHTML = '⏳ กำลังประมวลผล... <span class="count-badge">' + saveCounter + '</span>';
    msgDiv.innerText = '';

    const detection = await faceapi
      .detectSingleFace(video)
      .withFaceLandmarks()
      .withFaceDescriptor();

    if (!detection) {
      alert('ไม่พบใบหน้า! กรุณามองกล้องให้ชัดเจน');
      btnSave.disabled = false;
      btnSave.innerHTML = '📸 บันทึกใบหน้า <span class="count-badge" id="saveCount">' + saveCounter + '</span>';
      return;
    }

    const descriptorArray = Array.from(detection.descriptor);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        body: JSON.stringify({ action: 'registerUser', name, faceDescriptor: descriptorArray })
      });
      const data = await res.json();

      saveCounter++;
      countSpan.innerText = saveCounter;
      updateDots();
      msgDiv.innerHTML = '<span class="msg-success">✅ บันทึกครั้งที่ ' + saveCounter + ' สำเร็จ! ขยับหน้าเล็กน้อยแล้วกดอีกครั้ง</span>';
      btnSave.disabled = false;
      btnSave.innerHTML = '📸 บันทึกเพิ่ม <span class="count-badge" id="saveCount">' + saveCounter + '</span>';
    } catch (e) {
      msgDiv.innerHTML = '<span class="msg-error">❌ บันทึกล้มเหลว: ' + e.message + '</span>';
      btnSave.disabled = false;
      btnSave.innerHTML = '📸 บันทึกใบหน้า <span class="count-badge" id="saveCount">' + saveCounter + '</span>';
    }
  }
</script>
</body>
</html>
